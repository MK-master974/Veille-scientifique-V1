name: Tests

# Vérifie le moteur à chaque modification, sur toutes les branches. Aucun réseau, aucune clé
# d'API, aucun coût : l'IA est simulée. Un échec ici signale une régression avant la mise en ligne.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt pytest

      - name: Tests du moteur et de la chaîne complète
        run: python -m pytest tests

      - name: Démonstration (vrai moteur, IA simulée)
        run: python scripts/demo.py "$RUNNER_TEMP/apercu"

      - name: Les copies de secours des workflows sont identiques aux originaux
        run: |
          cmp installation/veille.yml .github/workflows/veille.yml
          cmp installation/site.yml .github/workflows/site.yml
