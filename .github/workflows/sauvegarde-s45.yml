name: Sauvegarde temporaire S45

# Workflow TEMPORAIRE, autorisé par Marvin le 11/11/2026.
# But : sortir du cache d'Actions les données de travail de la semaine 2026-S45 avant leur
# expiration (7 jours sans usage), et afficher un résumé chiffré dans le journal.
# Il ne lance aucune veille, n'appelle aucune IA et ne modifie ni le site ni les données publiées.
# À supprimer une fois la sauvegarde faite.
on:
  push:
    branches: ["claude/tender-davinci-bi5btm"]
    paths:
      - ".github/workflows/sauvegarde-s45.yml"
      - "scripts/resume_travail.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sauvegarde:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # Même dossier et même préfixe de clé que la veille hebdomadaire. La clé exacte n'existe
      # pas : c'est le préfixe qui retrouve le cache le plus récent de la semaine.
      - id: cache
        uses: actions/cache/restore@v4
        with:
          path: travail
          key: travail-2026-S45-sauvegarde
          restore-keys: travail-2026-S45-

      - name: Vérifier que les données sont là
        run: |
          if [ ! -d travail/2026-S45 ]; then
            echo "::error::Aucune donnée de travail pour 2026-S45 : le cache a expiré ou n'est pas accessible."
            exit 1
          fi
          echo "Cache retrouvé : ${{ steps.cache.outputs.cache-matched-key }}"
          ls -la travail/2026-S45

      - name: Résumé chiffré (aucun résumé d'article n'est affiché)
        run: python scripts/resume_travail.py travail/2026-S45

      # Le fichier des références contient les résumés des articles : il n'est pas copié,
      # car le dépôt est public. Les identifiants PubMed suffisent à les retrouver.
      - uses: actions/upload-artifact@v4
        with:
          name: travail-2026-S45
          path: |
            travail/2026-S45
            !travail/2026-S45/references.json
          retention-days: 90
          if-no-files-found: error
