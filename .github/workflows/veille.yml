name: Veille hebdomadaire

# Toutes les heures le lundi et le mardi (UTC). Chaque lancement fait avancer la veille
# de la semaine précédente : collecte, tri, rédaction, contrôle, publication, notification.
# Une fois la semaine terminée, les lancements suivants s'arrêtent en quelques secondes.
on:
  schedule:
    - cron: "17 * * * 1,2"
  workflow_dispatch:
    inputs:
      semaine:
        description: "Semaine à traiter (ex. 2026-S45). Laisser vide pour la semaine précédente."
        required: false
        default: ""
      direct:
        description: "Tout traiter en une fois (prix plein, environ 1 h) au lieu du traitement différé"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    outputs:
      publie: ${{ steps.avancer.outputs.publie }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - id: semaine
        env:
          SEMAINE_DEMANDEE: ${{ inputs.semaine }}
        run: python -m pipeline.run semaine "$SEMAINE_DEMANDEE" >> "$GITHUB_OUTPUT"

      # L'avancement de la semaine (lots d'IA en cours, références collectées) est gardé
      # dans le cache d'Actions entre deux lancements, pas dans le dépôt.
      - uses: actions/cache/restore@v4
        with:
          path: travail
          key: travail-${{ steps.semaine.outputs.semaine }}-${{ github.run_id }}
          restore-keys: travail-${{ steps.semaine.outputs.semaine }}-

      - id: avancer
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
          EMAIL_CONTACT: ${{ vars.EMAIL_CONTACT }}
          URL_SITE: ${{ vars.URL_SITE }}
          ONESIGNAL_APP_ID: ${{ vars.ONESIGNAL_APP_ID }}
          VEILLE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.direct && 'direct' || '' }}
        run: >
          python -m pipeline.run avancer --semaine "${{ steps.semaine.outputs.semaine }}"
          ${{ github.event_name == 'workflow_dispatch' && '--sans-echeance' || '' }}

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: travail
          key: travail-${{ steps.semaine.outputs.semaine }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Enregistrer la veille publiée dans le dépôt
        if: steps.avancer.outputs.publie == 'true'
        run: |
          git config user.name "veille-sante[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          git commit -m "Veille ${{ steps.semaine.outputs.semaine }}" || echo "Rien à enregistrer"
          git pull --rebase --autostash
          git push

  deployer:
    needs: veille
    if: needs.veille.outputs.publie == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pipeline.run initialiser
        env:
          EMAIL_CONTACT: ${{ vars.EMAIL_CONTACT }}
          URL_SITE: ${{ vars.URL_SITE }}
          ONESIGNAL_APP_ID: ${{ vars.ONESIGNAL_APP_ID }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploiement
        uses: actions/deploy-pages@v4
