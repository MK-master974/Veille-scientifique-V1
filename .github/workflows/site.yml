name: Mise en ligne du site

# Redéploie l'app quand son code ou ses réglages changent, ou à la demande.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "config.json"
      - "pipeline/catalogue.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deployer:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pipeline.run initialiser
        env:
          EMAIL_CONTACT: ${{ vars.EMAIL_CONTACT }}
          URL_SITE: ${{ vars.URL_SITE }}
          ONESIGNAL_APP_ID: ${{ vars.ONESIGNAL_APP_ID }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploiement
        uses: actions/deploy-pages@v4
