name: Banc d'essai

# Mesure la chaîne d'analyse sur le corpus de référence et compte ses écarts avec les corrigés.
# Rien n'est publié. Deux bancs : la chaîne actuelle de la veille (banc/banc.py) et l'extraction
# des données de la future fiche v2 (banc/banc_extraction.py). La dernière ligne de
# banc/lancement.json dit lequel lancer et avec quel plafond de coût.
# CE WORKFLOW APPELLE L'IA ET A UN COÛT : il ne se lance que sur demande explicite, en modifiant
# banc/lancement.json sur une branche de travail, ou par le bouton « Run workflow ». Le budget
# est vérifié avant tout appel. Le journal et les résultats sont publics : aucun texte d'article
# n'y figure, hors courts passages exacts d'articles sous licence CC BY ou CC0 (VS-D15).
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths:
      - "banc/lancement.json"

permissions:
  contents: read

concurrency:
  group: banc
  cancel-in-progress: false

jobs:
  banc:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Lancer le banc demandé par banc/lancement.json
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          EMAIL_CONTACT: ${{ vars.EMAIL_CONTACT }}
        run: python banc/lancer.py --sortie resultats-banc

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultats-banc
          path: resultats-banc
          retention-days: 90
          if-no-files-found: warn
